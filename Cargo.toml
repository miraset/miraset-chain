[package]
name = "miraset-chain"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
ed25519-dalek = "2.2.0"
hex = "0.4"
hotstuff_rs = "0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }



