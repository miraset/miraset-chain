[package]
name = "miraset-chain"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
borsh = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = "2.2.0"
hex = "0.4"
hotstuff_rs = { path = "lib/hotstuff_rs" }
libc = "0.2"
prost = "0.14"
rand = "0.10.3"
redb = "4.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
socket2 = { version = "0.6.5", features = ["all"] }
tempfile = "3.27.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync", "net"] }
tonic = "0.14"
tonic-prost = "0.14"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "env-filter", "tracing-log", "ansi", "std"] }
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower-http = { version = "0.6", features = ["cors"] }
zeroize = "1"

[dev-dependencies]
http-body-util = "0.1"

[build-dependencies]
protox = "0.10"
tonic-prost-build = "0.14"




# Dependencies (crypto, storage, serialization) are optimised even in debug builds: unoptimised
# Ed25519 verification is slow enough that a debug-build leader cannot produce a full block within
# a view. Our own crate stays at opt-level 0 for debugging.
[profile.dev.package."*"]
opt-level = 2
