[workspace]
resolver = "2"
members = [
    "crates/miraset-cli",
    "crates/miraset-tui",
    "crates/miraset-core",
    "crates/miraset-node",
    "crates/miraset-wallet",
    "crates/miraset-indexer",
    "crates/miraset-worker",
    "crates/miraset-launcher",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3"
authors = ["daochild"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full"] }
tokio-stream = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "=1.3.3"

# Crypto
ed25519-dalek = "3.0.0"
rand = "0.10.2"
blake3 = "1.5"
hex = "0.4"
zeroize = { version = "1.7", features = ["derive"] }

# Networking
axum = "0.8.8"
tower = "0.5"
tower-http = { version = "0.7.0", features = ["trace", "cors", "limit", "timeout"] }
axum-governor = { version = "2.0", features = ["dashmap", "tracing", "json"] }
reqwest = { version = "0.13.4", features = ["json"] }

# Database
sled = "0.34"

# CLI/TUI
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.30.0"
crossterm = "0.29.0"

# Logging/Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0.18"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Utils
bytes = "1.8"
parking_lot = "0.12"
toml = "1.1.3+spec-1.1.0"

# Gas metering
once_cell = "1.19"
