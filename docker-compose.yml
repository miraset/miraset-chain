# Experimental 5-validator devnet (f = 1). See docs/devnet.md.
#
# Five validators, not four: hotstuff_rs v0.4.0 needs four consecutive live leaders to commit,
# so an equal-power 4-validator set stops finalizing while any one validator is down.
name: miraset-devnet

x-validator: &validator
  image: miraset-chain:devnet
  build: .
  depends_on:
    devnet-init:
      condition: service_completed_successfully
  stop_grace_period: 30s
  # Sockets for RPC clients and P2P peers; the runtime default soft limit (1 024) ran out under
  # load. The node also raises its soft limit to the hard one at start.
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  # A consensus safety halt exits with code 3 (TODO 8.3.2); restart so the node recovers.
  restart: on-failure
  networks: [devnet]
  # Liveness, not readiness: a node that lost quorum or is catching up is alive but not ready,
  # and marking it unhealthy would hide the difference (see /readyz in docs/devnet.md).
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8545/livez"]
    interval: 5s
    timeout: 2s
    retries: 12

services:
  # One-shot: generates genesis.json into the shared config volume and each key into its own
  # volume (key custody D5): a validator container mounts only its own key, read-only, and only
  # the `faucet` tool sees the faucet key. A no-op once genesis exists, so
  # `docker compose down -v` is needed for a fresh chain.
  devnet-init:
    image: miraset-chain:devnet
    build: .
    command: ["devnet-init", "--out", "/devnet", "--keys-dir", "/keys", "--validators", "5", "--p2p-addr-template", "node{i}:9948"]
    volumes:
      - devnet-config:/devnet
      - faucet-key:/keys/faucet
      - coordinator-key:/keys/coordinator
      - governance-key:/keys/governance
      - node0-key:/keys/node0
      - node1-key:/keys/node1
      - node2-key:/keys/node2
      - node3-key:/keys/node3
      - node4-key:/keys/node4
    networks: [devnet]

  # Faucet signing tool for scripts/devnet/transfer.sh (`docker compose run --rm faucet ...`).
  faucet:
    image: miraset-chain:devnet
    build: .
    profiles: [tools]
    volumes: [faucet-key:/keys/faucet:ro]
    network_mode: none

  # Load generator for scripts/devnet/bench.sh and soak.sh (TODO 8.5.3). Holds the faucet key
  # (read-only) to fund throwaway senders; runs inside the devnet network, so validator netem
  # profiles also delay its responses and commit events (one way, not a full round trip).
  loadgen:
    image: miraset-chain:devnet
    build: .
    profiles: [tools]
    # Also the devnet coordinator key (TODO 8.5.1): receipts need a genesis coordinator.
    volumes: [faucet-key:/keys/faucet:ro, coordinator-key:/keys/coordinator:ro]
    networks: [devnet]

  node0:
    <<: *validator
    hostname: node0
    command: [start, --key-file=/var/lib/miraset-key/node0.key, --genesis=/devnet/genesis.json, --data-dir=/var/lib/miraset, --signing-guard=/var/lib/miraset-guard/signing-guard.redb, --p2p-addr=0.0.0.0:9948, --rpc-addr=0.0.0.0:8545]
    volumes: [devnet-config:/devnet:ro, node0-key:/var/lib/miraset-key:ro, node0-data:/var/lib/miraset, node0-guard:/var/lib/miraset-guard]
    ports: ["127.0.0.1:8545:8545"]
  node1:
    <<: *validator
    hostname: node1
    command: [start, --key-file=/var/lib/miraset-key/node1.key, --genesis=/devnet/genesis.json, --data-dir=/var/lib/miraset, --signing-guard=/var/lib/miraset-guard/signing-guard.redb, --p2p-addr=0.0.0.0:9948, --rpc-addr=0.0.0.0:8545]
    volumes: [devnet-config:/devnet:ro, node1-key:/var/lib/miraset-key:ro, node1-data:/var/lib/miraset, node1-guard:/var/lib/miraset-guard]
    ports: ["127.0.0.1:8546:8545"]
  node2:
    <<: *validator
    hostname: node2
    command: [start, --key-file=/var/lib/miraset-key/node2.key, --genesis=/devnet/genesis.json, --data-dir=/var/lib/miraset, --signing-guard=/var/lib/miraset-guard/signing-guard.redb, --p2p-addr=0.0.0.0:9948, --rpc-addr=0.0.0.0:8545]
    volumes: [devnet-config:/devnet:ro, node2-key:/var/lib/miraset-key:ro, node2-data:/var/lib/miraset, node2-guard:/var/lib/miraset-guard]
    ports: ["127.0.0.1:8547:8545"]
  node3:
    <<: *validator
    hostname: node3
    command: [start, --key-file=/var/lib/miraset-key/node3.key, --genesis=/devnet/genesis.json, --data-dir=/var/lib/miraset, --signing-guard=/var/lib/miraset-guard/signing-guard.redb, --p2p-addr=0.0.0.0:9948, --rpc-addr=0.0.0.0:8545]
    volumes: [devnet-config:/devnet:ro, node3-key:/var/lib/miraset-key:ro, node3-data:/var/lib/miraset, node3-guard:/var/lib/miraset-guard]
    ports: ["127.0.0.1:8548:8545"]
  node4:
    <<: *validator
    hostname: node4
    command: [start, --key-file=/var/lib/miraset-key/node4.key, --genesis=/devnet/genesis.json, --data-dir=/var/lib/miraset, --signing-guard=/var/lib/miraset-guard/signing-guard.redb, --p2p-addr=0.0.0.0:9948, --rpc-addr=0.0.0.0:8545]
    volumes: [devnet-config:/devnet:ro, node4-key:/var/lib/miraset-key:ro, node4-data:/var/lib/miraset, node4-guard:/var/lib/miraset-guard]
    ports: ["127.0.0.1:8549:8545"]

  # Opt-in measurement stack (TODO 8.5.3, docs/measurement-plan.md I5):
  #   docker compose --profile observe up -d
  # Prometheus (15 s scrape of every validator's /metrics) on 127.0.0.1:9090 and Grafana with the
  # provisioned "MIRASET devnet measurements" dashboard on 127.0.0.1:3000 (anonymous viewer).
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observe]
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=15d]
    volumes:
      - ./scripts/devnet/observe/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [devnet]

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [observe]
    depends_on: [prometheus]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./scripts/devnet/observe/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./scripts/devnet/observe/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    networks: [devnet]

networks:
  devnet: {}

volumes:
  devnet-config: {}
  # One key per volume (key custody D5).
  faucet-key: {}
  # Genesis coordinator (receipt co-signer) and governance (slashing, epoch close) keys,
  # TODO 8.5.1. No validator mounts them.
  coordinator-key: {}
  governance-key: {}
  node0-key: {}
  node1-key: {}
  node2-key: {}
  node3-key: {}
  node4-key: {}
  node0-data: {}
  node1-data: {}
  node2-data: {}
  node3-data: {}
  node4-data: {}
  # Vote signing guards (TODO 8.3.2). Kept apart from chain data: wiping nodeN-data alone is a
  # safe resync, wiping nodeN-guard for a validator that has signed is not.
  node0-guard: {}
  node1-guard: {}
  node2-guard: {}
  node3-guard: {}
  node4-guard: {}
  # Measurement profile data (observe).
  prometheus-data: {}
  grafana-data: {}
