version: '3.8'

services:
  node1:
    build: .
    container_name: miraset-node1
    ports:
      - "9944:9944"
      - "9948:9948"
    volumes:
      - node1-data:/data
    environment:
      - NODE_ID=1
      - RUST_LOG=info
      - MIRASET_STORAGE_PATH=/data
      - MIRASET_HOTSTUFF=true
      - MIRASET_HOTSTUFF_ADDR=0.0.0.0:9948
      - MIRASET_HOTSTUFF_KEY=1111111111111111111111111111111111111111111111111111111111111111
